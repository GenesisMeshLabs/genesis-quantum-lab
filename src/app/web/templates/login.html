<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>meta-quantum-harvest lab — sign in</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0b1020; color: #e6e9f2; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #131a30; padding: 32px; border-radius: 12px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.tag { color: #8a93b3; font-size: 12px; margin: 0 0 20px; }
    input { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #2a3352; background: #0e1428; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #4f6bff; color: #fff; font-weight: 600; cursor: pointer; }
    .error { color: #ff6b6b; font-size: 13px; margin-bottom: 10px; }
    .notice { color: #8a93b3; font-size: 11px; margin-top: 16px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Research Lab Sign In</h1>
    <p class="tag">meta-quantum-harvest — synthetic environment</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="text" name="username" placeholder="username" autocomplete="off" required>
      <input type="password" name="password" placeholder="password" required>
      <button type="submit">Sign in</button>
    </form>
    <div class="notice">
      All accounts and data on this system are synthetically generated for
      authorized lab research only. No real user data is present.
    </div>
  </div>
</body>
</html>
